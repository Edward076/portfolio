[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-rag-evaluation"
version = "0.1.0"
description = "Reproducible retrieval and reranking evaluation for scientific QA on Qasper"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0", "chromadb>=0.5"]
visualization = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
